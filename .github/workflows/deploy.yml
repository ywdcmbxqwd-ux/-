name: Deploy to GitHub Pages

# ライフライン本体: デフォルトブランチへの push で自動的に本番反映される。
# 手動でも Actions タブの "Run workflow" からいつでもデプロイ可能。
on:
  push:
    branches:
      - main
      - claude/setup-dev-environment-sjUq7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走行中の再デプロイはキャンセルせず順番に流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
